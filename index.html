<!DOCTYPE html>
<html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Moschouris Residence – Home Guide</title>
<style>
:root{--navy:#171717;--ink:#0a0a0a;--mute:#737373;--line:#e5e5e5;--bg:#fafafa;--card:#fff;--accent:#df2225;--soft:#f5f5f5}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--navy)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 10px}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-bottom:0;min-height:40px}
.back{appearance:none;border:0;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:15px;padding:7px 12px 7px 10px;border-radius:999px;cursor:pointer;display:none}
.back.show{display:inline-flex}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.ttl{font-weight:600;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:linear-gradient(160deg,#1F3864,#2b4a7e);color:#fff;padding:22px 0 64px}
.hero h1{font-size:28px;line-height:1.15;margin:6px 0 4px;font-weight:650;letter-spacing:-.01em}
.hero p{margin:0;opacity:.85;font-size:15px}
.rule{width:44px;height:3px;background:var(--accent);border-radius:2px;margin:14px 0 10px}
.search{margin-top:-40px;position:relative}
.search input{width:100%;font:inherit;font-size:17px;padding:15px 16px 15px 46px;border-radius:14px;border:1px solid var(--line);background:#fff;box-shadow:0 6px 24px rgba(20,30,60,.10);outline:none}
.search input:focus{border-color:var(--navy)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;min-height:120px;box-shadow:0 1px 2px rgba(0,0,0,.03);cursor:pointer}
.tile:active{transform:scale(.98)}
.tile .ic{width:38px;height:38px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:20px}
.tile b{font-size:16px;line-height:1.2}
.tile span{font-size:13px;color:var(--mute);line-height:1.3}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0}
.tile.wide .ic{flex:none}
.quick{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--navy);color:#fff;padding:13px 10px;border-radius:12px;font-weight:600;font-size:15px}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}
h2.sec{font-size:24px;margin:22px 0 6px;letter-spacing:-.01em}
.intro{color:var(--mute);font-size:15px;margin:0 0 12px}
h3.grp{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);margin:26px 0 10px;scroll-margin-top:120px}
h4.sub{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.card .t{font-weight:600;font-size:16px;line-height:1.3}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 12px;margin-top:8px;font-size:15px}
.kv dt{color:var(--mute);font-size:13px;padding-top:2px}
.kv dd{margin:0}
.card.hl{background:var(--soft);border-color:#cdd7e8}
.card.warn{border-left:4px solid var(--accent)}
.flash{animation:fl 1.8s ease}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.tbc{color:var(--mute);font-style:italic}
.muted{color:var(--mute)}
.fv{color:var(--navy);font-weight:700;margin-left:1px}
.note{font-size:13px;color:var(--mute);margin:4px 2px 8px}
.call{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--navy);color:#fff;text-decoration:none;padding:9px 14px;border-radius:999px;font-weight:600;font-size:15px}
.call.sm{background:#fff;color:var(--navy);border:1px solid #cdd7e8}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.acts .call{margin:0}
.hl .who:not(.pro){background:#fff}
a.tel,a.mail{white-space:nowrap;font-weight:600;text-decoration:none;border-bottom:1px dotted}
ol.steps{margin:6px 0 0;padding-left:22px}ol.steps li{margin:4px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;position:sticky;top:60px;background:var(--bg);z-index:3}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.task:first-of-type{border-top:0}
.who{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;margin-top:2px;background:var(--soft);color:var(--navy);min-width:52px;text-align:center}
.who.pro{background:var(--navy);color:#fff}
.mon .t{display:flex;justify-content:space-between;align-items:center}
.now{font-size:11px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase}
ul.b{margin:6px 0;padding-left:20px}ul.b li{margin:5px 0;font-size:15px}
.letter p{font-size:17px;line-height:1.6;margin:0 0 14px}
.res{margin-top:16px}
.res .card{cursor:pointer}
.res .where{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.res mark{background:#f3e3c3;border-radius:3px;padding:0 1px}
.empty{color:var(--mute);text-align:center;padding:30px 0}
footer{color:var(--mute);font-size:13px;text-align:center;margin-top:30px;line-height:1.6}

body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#8a90a0;font-size:10.5px;font-weight:600;padding:4px 0;border-radius:10px;cursor:pointer;max-width:90px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a.on{color:var(--navy)}
nav.tabs a.em.on,nav.tabs a.em{color:#a8442f}
nav.tabs a.em:not(.on){color:#b9786a}
.sheet-bg{position:fixed;inset:0;background:rgba(15,20,35,.35);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-width:760px;margin:0 auto}
.sheet.open{transform:none}.sheet-bg.open{display:block}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#d9dce4;margin:0 auto 12px}
.sheet a{display:flex;align-items:center;gap:14px;padding:14px 6px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:17px;font-weight:500}
.sheet a:first-of-type{border-top:0}
.sheet a .ic{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:18px}
.big911{display:flex;align-items:center;justify-content:center;gap:8px;background:#a8442f;color:#fff;text-decoration:none;font-weight:700;font-size:18px;padding:15px;border-radius:14px;margin:6px 0 10px}
.callgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.callgrid a{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.callgrid a b{display:block;font-size:14px;line-height:1.25}.callgrid a span{font-size:13px;color:var(--navy);font-weight:600}
.addall{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:0;background:var(--navy);color:#fff;font:inherit;font-weight:600;font-size:16px;padding:14px;border-radius:14px;cursor:pointer;margin:4px 0 6px}
.rem{flex:none;border:1px solid #cdd7e8;background:#fff;color:var(--navy);font:inherit;font-size:12px;font-weight:600;border-radius:999px;padding:4px 9px;cursor:pointer;margin-left:auto;white-space:nowrap}
.task>div{flex:1}
.seg{display:flex;background:#e9ebf0;border-radius:11px;padding:3px;gap:3px;margin:8px 0 12px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--mute);padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.plan{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px}
.plan svg{width:100%;height:auto;display:block;touch-action:manipulation}
.plan .rm rect{fill:#eef2f8;stroke:#1F3864;stroke-width:2.5;cursor:pointer;transition:fill .15s}
.plan .rm.has rect{fill:#e3e9f4}
.plan .rm:hover rect,.plan .rm:active rect{fill:#f3e3c3}
.plan .rm text{fill:#1F3864;font-weight:600;pointer-events:none;font-family:inherit}
.plan .rm text.n{fill:#6b7385;font-weight:500}
.plan .otb rect{fill:url(#hatch);stroke:#c5ccd9;stroke-width:1.5}
.plan .otb text{fill:#8a90a0;font-family:inherit}
.legend{font-size:13px;color:var(--mute);margin:6px 2px 0}
details.cat{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
details.cat summary{list-style:none;padding:14px 16px;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary::after{content:"›";font-size:22px;color:var(--mute);transition:transform .15s}
details.cat[open] summary::after{transform:rotate(90deg)}
details.cat summary small{color:var(--mute);font-weight:500;font-size:13px;margin-left:auto;margin-right:10px}
details.cat .prod{border-top:1px solid var(--line);padding:12px 16px}
details.cat .prod .kv{margin-top:0}
.roomhd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.roomhd .num{color:var(--mute);font-size:15px}
.rlist a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);padding:12px 2px;border-top:1px solid var(--line);font-size:16px}
.rlist a:first-child{border-top:0}.rlist a small{color:var(--mute)}

body{font-family:hind,"Hind",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,h4,.hero h1,h2.sec,.tile b,.card .t,.ttl,.sheet a,details.cat summary,.roomhd h2{font-family:khand,"Khand",Arial,sans-serif;font-weight:700}
h2.sec{font-size:32px;letter-spacing:-.8px;line-height:1.05}
.hero h1{font-size:40px;letter-spacing:-1px;line-height:1}
.tile b{font-size:19px;letter-spacing:-.2px;line-height:1.05}.card .t{font-size:18px;letter-spacing:-.1px;line-height:1.15}
header.top{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);border-bottom:1px solid var(--line)}
.wm{font-family:hind,Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:-.5px;font-size:18px;color:var(--ink);white-space:nowrap}
.ttl{font-size:20px}
#wm{text-decoration:none;font-size:15px}
header.top .wrap:has(.back:not(.show)) #wm{font-size:20px;order:-1;flex:1}
.back{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:0;font-family:hind,Arial,sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1.2px;padding:7px 12px}
.hero{background:#111;color:#fafafa;padding:26px 0 66px}
.hero .brand,.brand{font-family:hind,Arial,sans-serif;letter-spacing:2.4px;font-size:11px;text-transform:uppercase}
.rule{background:#fafafa;width:36px;height:1px}
.search input{border-radius:0;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.08);font-family:inherit}
.search input:focus{border-color:var(--ink)}
.btn,.call,.addall,.big911{border-radius:0;font-family:hind,Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;font-size:13px}
.btn{background:#171717;color:#fafafa;padding:15px 10px}
.btn.alt{background:#fff;color:#171717;border:1px solid #171717}
.call{background:#171717;color:#fafafa;padding:11px 16px}
.call.sm{background:#fff;color:#171717;border:1px solid #171717}
.addall{background:#171717;padding:16px}
.big911{background:var(--accent);font-size:15px}
.tile,.card,details.cat,.plan,.callgrid a,.search input{border-radius:0}
.tile{border:1px solid var(--line);box-shadow:none}
.tile .ic{border-radius:0;background:var(--soft)}
.card.hl{background:#f5f5f5;border-color:#d4d4d4}
.card.warn{border-left:3px solid var(--accent)}
h3.grp{font-family:hind,Arial,sans-serif;font-weight:700;color:var(--ink);letter-spacing:2px;font-size:12px}
.where{color:var(--mute)!important;letter-spacing:1.6px!important}
.res mark{background:#e5e5e5}
.chip{border-radius:0;font-family:hind,Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:12px;border-color:#d4d4d4}
.chip.on{background:#171717;border-color:#171717}
.who{border-radius:0;letter-spacing:.8px;text-transform:uppercase;font-size:11px;background:#f5f5f5;color:#171717;border:1px solid #d4d4d4}
.who.pro{background:#171717;color:#fafafa;border-color:#171717}
.now{background:#171717;border-radius:0}
.rem{border-radius:0;border-color:#171717;color:#171717;text-transform:uppercase;letter-spacing:.8px;font-size:11px}
.seg{border-radius:0;background:#f0f0f0}.seg button{border-radius:0;font-family:hind,Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:12px;font-weight:700}
.seg button.on{background:#171717;color:#fafafa;box-shadow:none}
.seg3d{flex:1;text-align:center;font-family:hind,Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:12px;font-weight:700;color:var(--mute);padding:8px 4px;text-decoration:none}
.plan .rm rect{fill:#ffffff;stroke:#171717;stroke-width:2}
.plan .rm.has rect{fill:#ececec}
.plan .rm:hover rect,.plan .rm:active rect{fill:#d4d4d4}
.plan .rm text{fill:#0a0a0a;font-family:khand,Arial,sans-serif;font-weight:700}
.plan .rm text.n{fill:#737373;font-family:hind,Arial,sans-serif;font-weight:400}
.plan .otb rect{stroke:#d4d4d4}
nav.tabs a{color:#a1a1a1;font-family:hind,Arial,sans-serif;text-transform:uppercase;letter-spacing:.6px;font-size:9.5px}
nav.tabs a.on{color:#0a0a0a}
nav.tabs a.em,nav.tabs a.em:not(.on){color:var(--accent)}
.sheet{border-radius:0}.sheet a .ic{border-radius:0}
.fv{color:var(--ink)}
a{color:var(--ink)}
footer{color:var(--mute)}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr}.hero h1{font-size:34px}}

/* Light Mode Only (Max, Oct 10 2026) */
:root{color-scheme:light}
.hero{background:#FBF8F2!important;color:#0a0a0a!important;border-bottom:1px solid #e5e5e5}
.hero p{opacity:1;color:#525252}.hero h1{color:#0a0a0a}.rule{background:#0a0a0a!important}
.btn,.call,.addall{background:#fff!important;color:#171717!important;border:1px solid #171717!important}
.chip.on,.seg button.on,.who.pro,.now{background:#F3EDE2!important;color:#0a0a0a!important;border:1px solid #171717!important}
nav.tabs a.on{box-shadow:inset 0 -2px 0 #171717}

/* Condensed accordion rows */
.accbar{display:flex;gap:8px;justify-content:flex-end;margin:4px 0 10px}
.accbar button{min-height:36px;padding:0 12px;background:#fff;border:1px solid #171717;color:#171717;font:700 11px hind,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;border-radius:0;cursor:pointer}
.acc{background:#fff;border:1px solid var(--line);margin:0 0 -1px}
.acc>.ah{all:unset;box-sizing:border-box;width:100%;min-height:52px;display:grid;grid-template-columns:1fr auto 18px;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.acc>.ah:focus-visible{outline:2px solid #171717;outline-offset:-2px}
.acc .at{font-weight:700;font-size:15px;line-height:1.25;color:var(--ink)}
.acc .am{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.acc .ch{width:10px;height:10px;border-right:2px solid #171717;border-bottom:2px solid #171717;transform:rotate(45deg) translateY(-3px);transition:transform .25s cubic-bezier(.2,.8,.2,1);justify-self:center}
.acc.open .ch{transform:rotate(225deg) translateY(-1px)}
.acc>.ab{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.2,.8,.2,1)}
.acc.open>.ab{grid-template-rows:1fr}
.acc>.ab>div{overflow:hidden;padding:0 14px}
.acc.open>.ab>div{padding-bottom:12px}
.acc.open{background:#FDFBF7}
.acc .kv{margin:0}
.acc .call{margin:6px 6px 0 0}
.accg{margin-bottom:14px}
.acc.flash{box-shadow:inset 3px 0 0 #171717}
@media(min-width:700px){.acc .am{max-width:300px}}

/* Sort control */
.sortbar{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin:2px 0 8px}
.sortbar .sl{font:700 11px hind,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-right:8px}
.sortbar button{min-height:34px;padding:0 10px;background:#fff;border:1px solid #171717;margin-left:-1px;color:#171717;font:600 12px hind,Arial,sans-serif;border-radius:0;cursor:pointer}
.sortbar button.on{background:#171717;color:#fff}
.slist>h3.sg{margin:14px 0 6px}
.slist>h3.sg:first-child{margin-top:4px}
.slist>.acc{will-change:transform}
@media print{header.top,.chips,.search,nav.tabs{display:none}}

r basket.", "You", ""], ["Dryers: clean the lint screen before or after every load.", "You", ""]]}, {"k": "h3", "t": "Good to Know"}, {"k": "li", "t": "Garage door openers: check them and lubricate the door hardware per the LiftMaster and Clopay instructions. The LiftMaster 98022 openers need no extra lubrication of their own; test the safety reverse monthly. Clopay asks you to lubricate the door’s moving parts at least twice a year with Clopay Garage Door Pro Lube or a synthetic lubricant. Don’t grease the door tracks."}, {"k": "li", "t": "Water heaters: never set the temperature above 160°F – it shortens the warranty."}, {"k": "li", "t": "Garage doors: don’t adjust springs, cables or brackets yourself. Call a pro."}, {"k": "h2", "t": "January"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["Keep the furnace and water heater vent pipes outside clear of snow and ice.", "You", ""], ["Replace both filters in the fresh-air ventilator (every 3 months). Replace, don’t wash, the filters.", "You", ""], ["Check the humidifier setting. If windows fog or frost on very cold days, turn it down.", "You", ""]]}, {"k": "h2", "t": "February"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["After heavy snow, check ceilings and walls under the flat roof for drips or stains. Don’t climb on the roof – call a pro if you see anything.", "You", ""], ["Clean the fireplace glass (only when cool, with a fireplace-safe glass cleaner).", "You", ""]]}, {"k": "h2", "t": "March"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["Test both sump pumps before spring rain: pour a bucket of water into each pit and make sure the pump starts and pumps out.", "You", ""], ["Check that the sump discharge pipes outside are clear.", "You", ""], ["Daylight saving time: replace smoke and CO alarm batteries.", "You", ""], ["Book the spring air conditioning tune-up and irrigation start-up.", "You", ""]]}, {"k": "h2", "t": "April"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["Replace both fresh-air ventilator filters.", "You", ""], ["Irrigation spring start-up: turn the water back on, check every zone and head, set the controller (basement).", "<b>PRO ★<\/b>", ""], ["Air conditioning tune-up for all 3 outdoor units. Clear leaves and debris around them.", "<b>PRO ★<\/b>", ""], ["Garage doors, spring round (1 of 2): clean and wax all 7 doors with liquid car wax (not paste). Required to keep the Clopay warranty.", "You", ""], ["Garage doors: oil the rollers, bearings and hinges. Don’t grease the tracks.", "You", ""], ["Turn the outdoor hose faucets back on after the last hard frost. Check for leaks inside the first time you use them.", "You", ""], ["Clean gutters and downspouts after spring seeds and pollen. Make sure downspouts drain away from the house.", "<b>You / PRO ★<\/b>", ""]]}, {"k": "h2", "t": "May"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["Pool opening: remove the cover, start up the pump, filter and heater, and balance the water.", "<b>PRO ★<\/b>", ""], ["Windows and doors: walk around outside and check the caulk around every window and door. Recaulk any cracks or gaps.", "<b>You / PRO ★<\/b>", ""], ["Windows: clean the tracks and clear the weep holes at the bottom of the frames with a soft brush.", "You", ""], ["Roof check: have the flat roof, roof drains and flashing looked over.", "<b>PRO ★<\/b>", ""], ["Humidifiers: turn them off for the cooling season.", "You", ""]]}, {"k": "h2", "t": "June"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["Test both sump pumps again, especially after heavy storms.", "You", ""], ["Outdoor kitchen: clean the grill and cooking equipment. If you ever smell gas, shut it off and call a pro.", "You", ""], ["Exterior walk-around: check brick, stone and trim caulk joints for cracks.", "You", ""]]}, {"k": "h2", "t": "July"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["Replace both fresh-air ventilator filters.", "You", ""], ["Keep about 2 feet clear around the A/C outdoor units. Hose off cottonwood or grass clippings gently (power off first).", "You", ""], ["Check irrigation coverage and adjust the controller for summer heat.", "You", ""]]}, {"k": "h2", "t": "August"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["Dryer vents: have the dryer exhaust ducts cleaned (once a year).", "<b>PRO ★<\/b>", ""], ["Check garage door weatherseals and window/door weatherstripping for wear.", "You", ""], ["Book fall service: furnaces, water heaters, fireplaces, generator, pool closing and irrigation blowout.", "You", ""]]}, {"k": "h2", "t": "September"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["Furnace annual service for all 3 furnaces (inspection, clean and check before heating season).", "<b>PRO ★<\/b>", ""], ["Water heater annual service for both heaters: inspection, flush out mineral build-up as needed for your water, clean the inlet water filter, and test the relief valve.", "<b>PRO ★<\/b>", ""], ["Fireplace annual service for each fireplace before you start using them.", "<b>PRO ★<\/b>", ""], ["Pool closing (late Sept or Oct, before the first freeze): backwash, winterize the filter, pump, heater and piping, and cover.", "<b>PRO ★<\/b>", ""]]}, {"k": "h2", "t": "October"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["Replace both fresh-air ventilator filters, and gently vacuum the ventilator core with a soft brush (once a year).", "You", ""], ["Garage doors, fall round (2 of 2): clean and wax all 7 doors. Required to keep the Clopay warranty.", "You", ""], ["Irrigation fall blowout before the first hard freeze. Turn the controller off for winter.", "<b>PRO ★<\/b>", ""], ["Shut off and drain the outdoor hose faucets. Disconnect all hoses.", "You", ""], ["Humidifiers: replace the water pad and turn them back on for the heating season.", "<b>You / PRO ★<\/b>", ""], ["Standby generator annual service before winter.", "<b>PRO ★<\/b>", ""]]}, {"k": "h2", "t": "November"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["Clean gutters and downspouts after the leaves are down. Check downspout extensions.", "<b>You / PRO ★<\/b>", ""], ["End of daylight saving time: replace smoke and CO alarm batteries.", "You", ""], ["Roof check before winter: make sure the flat roof drains are clear.", "<b>PRO ★<\/b>", ""]]}, {"k": "h2", "t": "December"}, {"k": "tbl", "rows": [["Task", "Who", "Done"], ["Keep vent pipes and the water heater condensate drain lines clear of snow and ice.", "You", ""], ["Test both sump pumps.", "You", ""], ["Look over your warranty registrations and service receipts, and book next year’s spring service.", "You", ""]]}], "warranty": [{"k": "h1", "t": "Warranty Summary"}, {"k": "p", "t": "Full warranty documents are in the <a href=\"https://www.dropbox.com/scl/fo/pj5d7g2vamon07byt0ao8/ABgKKAi2j2v6ofzLEeBcWLs?rlkey=uz1ozecpmayj0jfutqmwrz4eu&st=0vea45sd&dl=0\" target=\"_blank\" rel=\"noopener\">digital folder<\/a>. Keep receipts – most manufacturers ask for proof of purchase or install date.", "s": "intro"}, {"k": "box", "c": [{"k": "p", "t": "<b>Register These Now<\/b>", "s": "rb"}, {"k": "li", "t": "<b>Rinnai tankless water heaters (2)<\/b> – installed Aug 7, 2026. Rinnai needs registration within <b>90 days of installation<\/b> for the 5-year labor warranty (otherwise labor is 1 year). <b>Register by: Oct 12, 2026<\/b> – being registered by Weberman Construction in your name."}, {"k": "li", "t": "<b>Pentair pool equipment<\/b> (pump, filter, heater, controls) – register within <b>60 days of installation<\/b> at pentair.com/registration, with the sales receipt and the installer’s invoice from <b>American Pool Service<\/b>. Install expected Oct 2026. Without it, coverage is 60 days, parts only."}, {"k": "li", "t": "<b>Clopay garage doors (7)<\/b> – no deadline, but the doors <b>must be cleaned and waxed at least twice a year<\/b> to keep the warranty (it’s on your maintenance calendar for April and October)."}]}, {"k": "tbl", "rows": [["Item", "Manufacturer", "Coverage", "Registration Needed?", "Conditions / Notes"], ["<b>Your home – builder<\/b>", "Weberman Construction LLC", "Weberman Construction stands behind its workmanship and materials for one year from occupancy (August 7, 2026). Report any issue to Max by phone or email.", "No", ""], ["Tankless water heaters (2) – RXP199iN", "Rinnai", "Heat exchanger: 15 years or 12,000 operating hours, whichever comes first. Other parts: 5 years. Labor: 5 years if registered within 90 days of install (otherwise 1 year). Controller: 1 year parts.", "<b>Yes – within 90 days.<\/b> Being registered by Weberman Construction by Oct 12, 2026", "Keep temperature at or below 160°F. Damage from scale (hard water) or freezing isn’t covered. Annual pro inspection."], ["Pool equipment – pump, filter, heater, controls", "Pentair", "60 days, parts only, unless registered. Extended coverage when registered on time – see manufacturer warranty for each product.", "<b>Yes – within 60 days<\/b>", "Needs the sales receipt and installer invoice (American Pool Service). Extended warranty is for the original owner."], ["Garage doors (7) – Modern Steel 9208", "Clopay", "Paint finish: lifetime (single-family home). Sections/delamination: 5 years. Windows: 10 years. Hardware/springs: 3 years. Replacement parts only – labor not included.", "Online registration available; keep proof of purchase", "<b>Clean and wax at least twice a year.<\/b> Original purchaser only. Starts at delivery."], ["Furnaces (3), A/C units (3), humidifiers (Honeywell)", "Bryant (Honeywell humidifiers)", "Parts: per manufacturer warranty (full parts warranty requires registration). Labor: 1 year from Blue Ray Mechanical.", "<b>Yes<\/b> – being registered by Weberman Construction by Nov 5, 2026", "Change filters regularly; yearly pro service."], ["Fresh-air ventilator", "RenewAire", "See manufacturer warranty", "<span class=\"tbc\">To be confirmed<\/span>", "Replace filters every 3 months."], ["Garage door openers (7) – 98022", "LiftMaster", "See manufacturer warranty", "Optional; keep proof of purchase", "Monthly safety reverse test. Installed by Taylor Door Company."], ["Windows and Pella doors – Pella Reserve Traditional (wood)", "Pella", "For you as the original owners living in the home: lifetime coverage on the windows and doors themselves (including wood rot and cracking or peeling of the paint on the exterior cladding) and on the insulated glass. Labor: 2 years. Hardware and screens: 10 years. Exterior paint chalking or fading: 10 years. A later owner gets 10 years from the original sale.", "No registration card. Weberman Construction is asking Pella to put the order in your name.", "Report a problem within 1 year of finding it. Follow Pella’s care instructions. The lanai door came with a primed wood exterior, not factory paint: keep it painted. Paint added after delivery isn’t covered by Pella. Inspect exterior caulk yearly."], ["Folding glass doors", "Lumini Windows &amp; Doors", "See manufacturer warranty", "<span class=\"tbc\">To be confirmed<\/span>", ""], ["Glass panel and glass door (office to garage)", "City Glass", "<span class=\"tbc\">To be confirmed<\/span>", "<span class=\"tbc\">To be confirmed<\/span>", ""], ["Main front entry door (installed Jan 2026)", "Taylor Door Company (supplier); make <span class=\"tbc\">To be confirmed<\/span>", "See manufacturer warranty", "<span class=\"tbc\">To be confirmed<\/span>", "For service, call Taylor Door Company, (586) 755-6500."], ["Shingle roof – Grand Manor, Stone Gate Gray (installed June 2025)", "CertainTeed", "See manufacturer warranty", "<span class=\"tbc\">To be confirmed<\/span>", "Installed by Wendell Ross."], ["Flat roof (EPDM)", "Membrane maker <span class=\"tbc\">To be confirmed<\/span>", "Workmanship: 2 years from completion, from Stadler Maintenance. Membrane: see manufacturer warranty.", "<span class=\"tbc\">To be confirmed<\/span>", "Installed by Stadler Maintenance."], ["Gas fireplaces (2) – family room/lanai and great room (installed about Jul 31, 2026)", "Heat &amp; Glo", "See manufacturer warranty", "<span class=\"tbc\">To be confirmed<\/span>", "Annual service by a qualified technician. Installed by Oakland Fireplace and Garage Door."], ["Electric fireplace – basement, NEFL60CFH-1 (installed about Jul 31, 2026)", "Napoleon", "See manufacturer warranty", "<span class=\"tbc\">To be confirmed<\/span>", "Installed by Woodward Electric."], ["Refrigerator/freezer columns", "Thermador", "2 years (730 days) from purchase on defects in materials and workmanship; cosmetic defects 60 days from purchase or closing. Longer coverage on certain parts – see warranty.", "Recommended (registration card), not required", "Household use only."], ["Other kitchen &amp; laundry appliances (delivered April 2026)", "Monogram, GE, Bosch, Frigidaire Professional, Zephyr, InSinkErator", "See manufacturer warranty", "Recommended", "Service through the manufacturer. Supplied and installed by Big George’s."], ["Outdoor kitchen", "Lynx, Zephyr", "See manufacturer warranty", "<span class=\"tbc\">To be confirmed<\/span>", ""], ["Security, network &amp; audio/video", "2GIG, Ring, Araknis, WattBox, eero, Sonos", "See manufacturer warranty", "<span class=\"tbc\">To be confirmed<\/span>", "Installed by New Age Entertainment."], ["Foundation walls", "Great Lakes Superior Walls", "Platinum Warranty with Rider (their top level). Full terms on the warranty certificate.", "No", "Installed Aug 20, 2024."]]}, {"k": "p", "t": "<b>†<\/b> To be confirmed on site.", "s": "fvn"}, {"k": "h2", "t": "Registration Log (Fill In as You Go)"}, {"k": "tbl", "rows": [["Item", "Registered On", "Confirmation #", "By"], ["Rinnai water heater 1", "", "", "Weberman Construction (in your name)"], ["Rinnai water heater 2", "", "", "Weberman Construction (in your name)"], ["Pentair pool equipment", "", "", ""], ["Bryant furnaces &amp; A/C (Weberman Construction, in your name)", "", "", ""], ["Clopay garage doors", "", "", ""], ["Pella windows &amp; doors (order in your name)", "", "", ""], ["Other:", "", "",
