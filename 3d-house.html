*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#F5F5F5;font-family:Hind,system-ui,sans-serif;color:#0A0A0A}
header{position:fixed;top:0;left:0;right:0;height:52px;background:#FBF8F2;color:#0A0A0A;border-bottom:1px solid #E5E5E5;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:5}
header a{color:#0A0A0A;text-decoration:none;font-size:22px;line-height:1}
header h1{font-family:Khand;font-weight:700;font-size:20px;letter-spacing:.5px;margin:0;text-transform:uppercase}
header small{margin-left:auto;font-size:11px;color:#737373;letter-spacing:1px;text-transform:uppercase}
#c{position:fixed;top:52px;left:0;right:0;bottom:0}
#lv{position:fixed;top:62px;left:10px;right:10px;display:flex;gap:6px;z-index:4;flex-wrap:wrap}
#lv button{font-family:Hind;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;font-size:11px;padding:10px 12px;border:1px solid #171717;background:#fff;color:#171717;border-radius:0;cursor:pointer}
#lv select{font-family:Hind;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;font-size:11px;padding:9px 8px;border:1px solid #171717;background:#fff;color:#171717;border-radius:0}
#lv button.on{background:#F3EDE2;color:#0A0A0A;box-shadow:inset 0 -3px 0 #171717}
#hint{position:fixed;left:10px;bottom:12px;font-size:12px;color:#737373;z-index:3;background:rgba(255,255,255,.85);padding:4px 8px;border:1px solid #E5E5E5}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:58%;overflow:auto;background:#fff;border-top:1px solid #D4D4D4;transform:translateY(105%);transition:transform .25s;z-index:6;padding:16px 18px 24px}
#sheet.open{transform:none}
#sheet h2{font-family:Khand;font-weight:700;font-size:26px;margin:0 0 2px;line-height:1.1}
#sheet .sub{color:#737373;font-size:13px;margin-bottom:12px}
#sheet .x{position:absolute;right:12px;top:10px;border:1px solid #171717;background:#fff;width:36px;height:36px;font-size:18px;cursor:pointer;border-radius:0}
.cat{border:1px solid #E5E5E5;margin-bottom:8px}
.cat>button{width:100%;text-align:left;background:#FAFAFA;border:0;padding:12px 14px;font-family:Hind;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1.2px;display:flex;justify-content:space-between;cursor:pointer;color:#0A0A0A}
.cat .bd{display:none;padding:4px 14px 10px}
.cat.open .bd{display:block}
.it{padding:8px 0;border-top:1px solid #F5F5F5;font-size:14px;line-height:1.4}
.it:first-child{border-top:0}.it b{display:block}.it span{color:#737373;font-size:13px}
.tbc{color:#A1A1A1;font-style:italic}
.note{font-size:12px;color:#737373;margin-top:10px}
@media(min-width:900px){#sheet{left:auto;top:52px;width:380px;max-height:none;border-top:0;border-left:1px solid #D4D4D4;transform:translateX(105%)}#sheet.open{transform:none}}

#padT{position:fixed;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:7;min-width:44px;height:44px;padding:0 12px;background:#fff;border:1px solid #171717;color:#171717;font:700 12px Hind,system-ui;letter-spacing:.1em;text-transform:uppercase;display:none;cursor:pointer}
#pad{position:fixed;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:7;background:#FBF8F2;border:1px solid #171717;padding:6px;display:grid;grid-template-columns:repeat(4,44px);gap:4px;user-select:none;-webkit-user-select:none;touch-action:none}
#pad button{width:44px;height:44px;background:#fff;border:1px solid #171717;color:#171717;font:700 16px Hind,system-ui;padding:0;cursor:pointer;border-radius:0;display:grid;place-items:center}
#pad button.on{background:#F3EDE2;box-shadow:inset 0 -3px 0 #171717}
#pad .w2{grid-column:span 2;width:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
#pad .x{grid-column:span 4;width:auto;height:32px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
body.sheetopen #pad,body.sheetopen #padT{display:none!important}
@media(max-width:699px){#padT{display:block}#pad{display:none}#pad.open{display:grid}#padT.open{bottom:calc(68px + 230px)}}
@media(min-width:900px){body.sheetopen #pad{display:grid!important;right:394px}}

#lv button[data-l],#lv select{display:none!important}
#goto{position:relative;z-index:8;font-family:Hind,system-ui}
#gotoB{min-height:44px;min-width:200px;max-width:70vw;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;background:#fff;border:1px solid #171717;color:#0A0A0A;font:700 12px Hind,system-ui;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:0}
#gotoB span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gotoB i{font-style:normal;transition:transform .25s}
#goto.open #gotoB i{transform:rotate(180deg)}
#gotoL{position:absolute;top:48px;left:0;width:min(320px,calc(100vw - 20px));max-height:min(62vh,520px);overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid #171717;box-shadow:0 12px 30px rgba(10,10,10,.12);opacity:0;transform:translateY(-6px) scaleY(.97);transform-origin:top;pointer-events:none;transition:opacity .2s cubic-bezier(.2,.8,.2,1),transform .2s cubic-bezier(.2,.8,.2,1);margin:0;padding:4px 0;list-style:none}
#goto.open #gotoL{opacity:1;transform:none;pointer-events:auto}
#gotoL li{padding:0 14px;min-height:40px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:#0A0A0A}
#gotoL li.lv{font:700 12px Hind,system-ui;letter-spacing:.1em;text-transform:uppercase;background:#FBF8F2;border-top:1px solid #E5E5E5;min-height:44px;position:sticky;top:0}
#gotoL li.rm{padding-left:24px}
#gotoL li small{color:#737373;margin-left:auto;font-size:12px}
#gotoL li[aria-selected=true],#gotoL li:hover,#gotoL li.kb{background:#F3EDE2}

(function(){const KEYV={'117':'kitchen','110':'foyer','123':'vestibule','108':'stair','112':'greatroom','118':'dining','121':'living','122':'lanai','105':'primarybed','102':'primarybath','104':'closet','114':'powder114','115':'powder115','116':'mudroom','120':'pantry','103':'office','201':'natia','204':'natiabath','202':'natiawic','206':'fos','208':'aris','210':'jackjill','203':'laundry','205':'hall','209':'boyswic','213':'shoeden','004':'bsmtliving','008':'wine','012':'gym','002':'familysuite','005':'bsmtbath','013':'lockerroom','010':'mech'};
